<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漢字プリント作成</title><meta name="description" content="入力した問題の文字をひらがな・空欄升に切り替え、ふりがなを編集してA4に印刷できます。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232b5193'/%3E%3Crect x='8' y='5' width='17' height='23' fill='white'/%3E%3Cpath d='M11 11h11M11 17h11M11 23h11' stroke='%232b5193' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>漢字プリント作成</h1><span>A4横・縦書き</span></div><div class="print-actions"><button id="print" class="primary">印刷</button><button id="pdf" class="primary">PDFを作る（iPad用）</button></div></header><main><aside class="controls"><section class="settings"><label>単元名（空欄でも使えます）<input id="unitName" placeholder="例：春のようす" maxlength="30"></label><div class="checks"><label><input id="printUnit" type="checkbox" checked>単元名を印刷する</label></div><div class="counts"><label>学年<input id="grade" placeholder="例：２年" maxlength="10"></label><label>ページ・日付など<input id="marker" placeholder="例：1/30" maxlength="10"></label></div><div class="checks"><label><input id="printMeta" type="checkbox" checked>学年・ページなどを印刷する</label><label><input id="printName" type="checkbox" checked>なまえを印刷する</label></div><label style="margin-top:14px">なまえ（空欄なら手書き用）<input id="studentName" placeholder="名前" maxlength="20" autocomplete="off"></label><p class="helper fontnote">フォント：UD デジタル教科書体<br>端末にない場合は、利用できるUD書体を優先します。</p><div class="counts"><label>上半分の問題数<input id="upper" type="number" min="1" max="15" value="5"></label><label>下半分の問題数<input id="lower" type="number" min="0" max="15" value="5"></label></div><div class="checks" role="group" aria-label="印刷の段数"><label><input id="oneRow" type="checkbox">一段</label><label><input id="twoRows" type="checkbox" checked>二段</label></div><p class="helper">問題数によって升の大きさが変わります。10問以上で自動的に上下２段になります。</p><div class="checks"><label><input id="guides" type="checkbox" checked>升目に十字線</label><label><input id="divider" type="checkbox">上下の区切り線</label></div></section><section><div class="tabs" role="tablist" aria-label="編集する場所"><button id="topTab" role="tab" aria-selected="true" class="active">上半分</button><button id="bottomTab" role="tab" aria-selected="false">下半分</button></div><p class="helper">問題を入力し、下の文字を押して表示方法を選びます。</p><div id="questions"></div></section></aside><section class="preview"><div class="previewbar"><strong>A4の印刷配置</strong><span id="metrics"></span></div><div class="paper-wrap"><div id="paper"></div></div><div id="pdfResult" aria-live="polite"></div><p class="helper" id="status" aria-live="polite"></p><p class="helper">PDF保存は印刷画面で「PDFに保存」を選択。A4・横向き・倍率100％・余白なし・ヘッダーとフッターなしにしてください。</p></section></main><script type="module" src="app.mjs"></script></body></html>
